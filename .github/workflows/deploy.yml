# Title ng workflow sa GitHub Actions
name: Classroom CI/CD

# Event triggers
on:
  pull_request: # Trigger kapag may pull request na na-create o na-update
  push:         # Trigger kapag may new code na na-push
    branches: [main] # ito yung main branch natin

# Jobs
jobs:

  # -------------------------------------------------------------
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # -------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest # Run this job on a fresh Linux virtual machine
    
    steps:
      # Step 1: Download/checkout the code from the repository into the runner
      - uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment on the runner machine[cite: 8, 9, 22, 23]
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Specify Node.js version 22 to install[cite: 8, 9, 22, 23]

      # Step 3: Install exact project dependencies listed in package-lock.json[cite: 8, 9, 22, 23]
      - run: npm ci

      # Step 4: Run automated unit tests to verify the code works[cite: 3, 8, 9, 22, 23]
      - run: npm test


  # -------------------------------------------------------------
  # JOB 2: CONTINUOUS DELIVERY (CD) - DEPLOY TO GITHUB PAGES[cite: 1, 4, 23]
  # -------------------------------------------------------------
  deploy:
    # Safety condition: Only run this job if triggered by a push directly on 'main'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    # Gate control: Wait for Job 1 ('ci') to pass before starting deployment
    needs: ci
    
    # Security: Grant only minimum permissions needed (Least Privilege principle)
    permissions:
      contents: read   # Allow reading repo content[cite: 23]
      pages: write      # Allow publishing to GitHub Pages[cite: 23]
      id-token: write   # Allow secure authentication via OpenID Connect (OIDC)[cite: 5, 17, 23]
    
    # Environment tracking: Record deployment details in GitHub's deployment history[cite: 11, 12, 13, 23]
    environment:
      name: github-pages # Target environment name[cite: 11, 23]
      url: ${{ steps.deployment.outputs.page_url }} # Output URL generated after deployment[cite: 23]
    
    runs-on: ubuntu-latest # Run deployment on a fresh Linux virtual machine[cite: 3, 8, 9, 23]
    
    steps:
      # Step 1: Download code onto the runner machine[cite: 8, 9, 22, 23]
      - uses: actions/checkout@v4

      # Step 2: Configure GitHub Pages settings for automated deployment[cite: 23]
      - uses: actions/configure-pages@v5

      # Step 3: Bundle and package static website files into an artifact bundle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: . # Package all files in root directory[cite: 23]

      # Step 4: Deploy packaged artifact to live web hosting (stores ID for URL output)[cite: 23]
      - id: deployment
        uses: actions/deploy-pages@v4